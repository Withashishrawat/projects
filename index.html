<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>to-do</title>
</head>

<body>
  <div id="container">
    <div id="input-container">
      <input type="text" id="text-input" placeholder="add" />
      <input type="button" value="submit" id="submit-btn" />
      <input type="button" value="Remove all" id="remove-all" />
    </div>
  </div>

  <script>
    //access all HTML containt
    const mainContainer = document.getElementById("container");
    const container = document.getElementById("input-container");
    const input = document.getElementById("text-input");
    const addButton = document.getElementById("submit-btn");
    const removeAll = document.getElementById("remove-all");

    const list = document.createElement("div");
    const ul = document.createElement("ul");
    list.appendChild(ul);

    addButton.addEventListener("click", (e) => {
      e.preventDefault();
      if (input.value === "") return;

      else {
        //create elements when submit btn clicked
        const li = document.createElement("li");
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "delete";
        li.textContent = input.value.trim();
        li.appendChild(deleteBtn);
        ul.appendChild(li);
        mainContainer.appendChild(list);
        input.value = "";

        deleteBtn.addEventListener("click", () => {
          li.remove();
        });
      }
    });

    removeAll.addEventListener("click", function removeAllBtn() {
      ul.innerText = "";
    });

  </script>
</body>

</html>
